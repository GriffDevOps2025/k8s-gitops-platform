apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-app-local
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: web-app
    app.kubernetes.io/part-of: k8s-gitops-platform
spec:
  project: default
  
  source:
    repoURL: https://github.com/GriffDevOps2025/k8s-gitops-platform.git
    targetRevision: HEAD
    path: applications/web-app/overlays/local
  
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneP