apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-service-local
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: api-service
    app.kubernetes.io/part-of: k8s-gitops-platform
    tier: backend
spec:
  project: default
  
  source:
    repoURL: https://github.com/GriffDevOps2025/k8s-gitops-platform.git
    targetRevision: HEAD
    path: applications/api-service/overlays/local
  
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
  
  revisionHistoryLimit: 10