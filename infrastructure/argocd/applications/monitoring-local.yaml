apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-local
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/part-of: k8s-gitops-platform
    app.kubernetes.io/component: observability
spec:
  project: default
  
  source:
    repoURL: https://github.com/GriffDevOps2025/k8s-gitops-platform.git
    targetRevision: HEAD
    path: infrastructure/monitoring
  
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  revisionHistoryLimit: 10